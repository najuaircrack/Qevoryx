name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libncursesw5-dev

      - name: Build dynamic
        run: make

      - name: Build static
        run: make static

      - name: Verify
        run: |
          file qevoryx
          file qevoryx-static

      - name: Generate checksums
        run: |
          sha256sum qevoryx > qevoryx-linux-amd64.sha256
          sha256sum qevoryx-static > qevoryx-linux-amd64-static.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            qevoryx
            qevoryx-static
            qevoryx-linux-amd64.sha256
            qevoryx-linux-amd64-static.sha256

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          cp artifacts/linux-amd64/qevoryx release/qevoryx-linux-amd64
          cp artifacts/linux-amd64/qevoryx-static release/qevoryx-linux-amd64-static
          cp artifacts/linux-amd64/qevoryx-linux-amd64.sha256 release/
          cp artifacts/linux-amd64/qevoryx-linux-amd64-static.sha256 release/
          chmod +x release/qevoryx-linux-amd64 release/qevoryx-linux-amd64-static

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Qevoryx ${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/qevoryx-linux-amd64
            release/qevoryx-linux-amd64-static
            release/qevoryx-linux-amd64.sha256
            release/qevoryx-linux-amd64-static.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
