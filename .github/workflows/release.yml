name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Generate checksum
        run: sha256sum build/qevoryx > qevoryx-linux-amd64.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            build/qevoryx
            qevoryx-linux-amd64.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Generate checksum
        shell: pwsh
        run: Get-FileHash build/Release/qevoryx.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  qevoryx-windows-amd64.exe" } | Out-File qevoryx-windows-amd64.exe.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            build/Release/qevoryx.exe
            qevoryx-windows-amd64.exe.sha256

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          cp artifacts/linux-amd64/qevoryx release/qevoryx-linux-amd64
          cp artifacts/linux-amd64/qevoryx-linux-amd64.sha256 release/
          cp artifacts/windows-amd64/qevoryx.exe release/qevoryx-windows-amd64.exe
          cp artifacts/windows-amd64/qevoryx-windows-amd64.exe.sha256 release/
          chmod +x release/qevoryx-linux-amd64

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Qevoryx ${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/qevoryx-linux-amd64
            release/qevoryx-linux-amd64.sha256
            release/qevoryx-windows-amd64.exe
            release/qevoryx-windows-amd64.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
