name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        run: |
          ./build/qevoryx --help
          ./build/qevoryx --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qevoryx-linux-amd64
          path: build/qevoryx

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        run: |
          ./build/Release/qevoryx.exe --help
          ./build/Release/qevoryx.exe --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qevoryx-windows-amd64
          path: build/Release/qevoryx.exe
