name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libncursesw5-dev

      - name: Build dynamic
        run: make

      - name: Build static
        run: make static

      - name: Smoke test
        run: |
          ./qevoryx --help
          ./qevoryx --version

      - name: Verify
        run: |
          file qevoryx
          file qevoryx-static

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qevoryx-linux-amd64
          path: |
            qevoryx
            qevoryx-static
