name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Build dynamic
        run: make

      - name: Build static
        run: make static

      - name: Verify
        run: |
          file qevoryx
          file qevoryx-static

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qevoryx-linux-amd64
          path: |
            qevoryx
            qevoryx-static

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make

      - name: Build
        shell: msys2 {0}
        run: make clean && make static

      - name: Verify
        shell: msys2 {0}
        run: file qevoryx-static.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qevoryx-windows-amd64
          path: qevoryx-static.exe
